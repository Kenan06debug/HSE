{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h5 class="mb-0">HiiT Staff Portal Login</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="admin" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="password123" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>
            </div>
            <div class="card-footer text-center bg-light text-muted small">
                Demo Credentials: Username: <strong>admin</strong> | Password: <strong>password123</strong>
            </div>
        </div>
    </div>
</div>
{% endblock %}
